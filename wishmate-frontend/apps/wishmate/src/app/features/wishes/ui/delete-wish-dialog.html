<h2 mat-dialog-title>{{ content.deleteTitle }}</h2>
<mat-dialog-content [attr.aria-busy]="pending()">
  <p>{{ content.deleteDescription }}</p>
  <p class="wish-name">{{ data.wish.name }}</p>
  @if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
  } @if (pending()) {
  <p role="status">{{ content.deleting }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()" [disabled]="pending()">
    {{ content.cancel }}
  </button>
  <button
    mat-flat-button
    class="danger"
    type="button"
    (click)="submit()"
    [disabled]="pending()"
  >
    {{ content.delete }}
  </button>
</mat-dialog-actions>
