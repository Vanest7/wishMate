spring.application.name=gifts

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# JWT
spring.security.oauth2.resourceserver.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION:file:${user.home}/.wishmate/jwt-public.pem}
security.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION:file:${user.home}/.wishmate/jwt-private.pem}
security.jwt.issuer=wishmate
security.jwt.access-token-ttl=PT15M

# CORS
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}