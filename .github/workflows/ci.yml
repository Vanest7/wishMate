name: WishMate CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wishmate-frontend
    env:
      CI: 'true'
      HUSKY: '0'
      NX_DAEMON: 'false'
      NX_SKIP_NX_CACHE: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wishmate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wishmate-frontend-${{ github.sha }}
          path: wishmate-frontend/dist/apps/wishmate/browser/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: demo/pom.xml

      - name: Generate temporary JWT keys for tests
        shell: bash
        run: |
          umask 077
          key_directory="$RUNNER_TEMP/wishmate-test-keys"
          mkdir -p "$key_directory"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$key_directory/private.pem" 2>/dev/null
          openssl pkey -in "$key_directory/private.pem" -pubout \
            -out "$key_directory/public.pem"
          printf 'JWT_PRIVATE_KEY_LOCATION=file:%s/private.pem\n' "$key_directory" >> "$GITHUB_ENV"
          printf 'JWT_PUBLIC_KEY_LOCATION=file:%s/public.pem\n' "$key_directory" >> "$GITHUB_ENV"

      - name: Run tests and build JAR
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wishmate-backend-test-reports-${{ github.sha }}
          path: |
            demo/target/surefire-reports/
            demo/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wishmate-backend-${{ github.sha }}
          path: demo/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary JWT keys
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/wishmate-test-keys"
