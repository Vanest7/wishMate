services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: regalos_db
      MARIADB_USER: wishmate_app
      MARIADB_PASSWORD: ${WISHMATE_DB_PASSWORD:?Start with run_docker.py}
      MARIADB_ROOT_PASSWORD: ${WISHMATE_DB_ROOT_PASSWORD:?Start with run_docker.py}
    volumes:
      - db-data:/var/lib/mysql
      - type: bind
        source: ./wishmate-schema.sql
        target: /docker-entrypoint-initdb.d/01-schema.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker/02-user-handle.sql
        target: /docker-entrypoint-initdb.d/02-user-handle.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          healthcheck.sh --connect --innodb_initialized &&
          mariadb --protocol=tcp -h 127.0.0.1 -u "$${MARIADB_USER}"
          --password="$${MARIADB_PASSWORD}" "$${MARIADB_DATABASE}"
          -e 'SELECT username FROM usuarios LIMIT 0'
      interval: 5s
      timeout: 4s
      retries: 24

  api:
    build:
      context: ./demo
    environment:
      PORT: '10000'
      DB_URL: jdbc:mariadb://db:3306/regalos_db
      DB_USERNAME: wishmate_app
      DB_PASSWORD: ${WISHMATE_DB_PASSWORD:?Start with run_docker.py}
      JWT_PRIVATE_KEY_LOCATION: file:/run/wishmate-keys/jwt-private.pem
      JWT_PUBLIC_KEY_LOCATION: file:/run/wishmate-keys/jwt-public.pem
      CORS_ALLOWED_ORIGINS: http://localhost:${WISHMATE_PORT:-8080},http://127.0.0.1:${WISHMATE_PORT:-8080}
    volumes:
      - type: bind
        source: ${WISHMATE_KEYS_DIR:?Start with run_docker.py}
        target: /run/wishmate-keys
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./wishmate-frontend
    ports:
      - '127.0.0.1:${WISHMATE_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 3 -O /dev/null http://127.0.0.1/auth/login &&
          wget -q -T 3 -O /dev/null http://127.0.0.1/api/auth/csrf
      interval: 5s
      timeout: 8s
      retries: 30

volumes:
  db-data:
